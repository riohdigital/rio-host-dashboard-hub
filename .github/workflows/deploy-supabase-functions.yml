# Publica as Edge Functions de sincronização de reservas no Supabase.
#
# Serve para quem não usa terminal: basta abrir a aba Actions do GitHub,
# escolher este workflow e clicar em "Run workflow".
#
# Pré-requisito (uma vez só): cadastrar o secret SUPABASE_ACCESS_TOKEN em
# Settings > Secrets and variables > Actions. O token é gerado em
# https://supabase.com/dashboard/account/tokens
#
# Passo a passo completo: docs/PASSO-A-PASSO-ATIVACAO.md

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cwcauobnbmzjpqjmmomc

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pega erro de compilação antes do deploy. Uma variável usada antes de
      # existir já derrubou o processamento de e-mail inteiro em produção.
      - name: Conferir o código das funções
        run: npx --yes typescript@5.5.3 tsc -p supabase/functions/tsconfig.json --noEmit

      - name: Conferir se o token foi cadastrado
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      # As duas funções fazem a própria checagem de acesso (segredo de cron ou
      # usuário logado), por isso a verificação automática de JWT fica desligada.
      - name: Publicar sync-channel-reservations
        run: |
          supabase functions deploy sync-channel-reservations \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Publicar ingest-reservation-email
        run: |
          supabase functions deploy ingest-reservation-email \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
